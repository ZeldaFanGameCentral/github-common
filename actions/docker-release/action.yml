name: Docker Release to GHCR
description: >
  Builds a Docker image and pushes it to GitHub Container Registry.
  Tags with both the given tag and :latest.

inputs:
  image_name:
    description: Image name (e.g., zfgbb, zfgbb-react)
    required: true
  docker_target:
    description: Dockerfile target stage (e.g., deploy, app)
    required: true
  dockerfile:
    description: Path to the Dockerfile, relative to the repo root
    required: false
    default: Dockerfile
  build_args:
    description: Docker build-args (multi-line, one per line)
    required: false
    default: ""
  tag:
    description: Image tag (defaults to first 12 chars of GITHUB_SHA)
    required: false
    default: ""
  revision:
    description: Full commit SHA recorded in the image labels (defaults to GITHUB_SHA)
    required: false
    default: ""
  registry_token:
    description: Token for GHCR authentication (pass secrets.GITHUB_TOKEN)
    required: true

outputs:
  tag:
    description: The image tag that was pushed
    value: ${{ steps.meta.outputs.tag }}

runs:
  using: composite
  steps:
    - id: meta
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image_name }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_REVISION: ${{ inputs.revision }}
      run: |
        set -euo pipefail
        echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"
        tag="$INPUT_TAG"
        if [[ -z "$tag" ]]; then tag="${GITHUB_SHA::12}"; fi
        revision="$INPUT_REVISION"
        if [[ -z "$revision" ]]; then revision="$GITHUB_SHA"; fi
        {
          echo "tag=$tag"
          echo "revision=$revision"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        } >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v4

    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.registry_token }}

    - uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.docker_target }}
        push: true
        provenance: false
        build-args: ${{ inputs.build_args }}
        tags: |
          ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          ${{ env.IMAGE }}:latest
        labels: |
          maintainer=${{ github.repository_owner }}
          org.opencontainers.image.vendor=${{ github.repository_owner }}
          org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.title=${{ inputs.image_name }}
          org.opencontainers.image.description=${{ github.event.repository.description }}
          org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}
          org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
          org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
